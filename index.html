<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIMEX — ศูนย์รวม Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1424; --bg2:#141a30; --panel:#ffffff; --panel-dark:#1a2140;
    --line:#e6e9f2; --line-dark:#2a335a;
    --text:#1c2537; --text-inv:#eef1fb; --sub:#6b7690; --sub-inv:#9aa5cc;
    --brand:#4f6df5; --brand2:#7c5cff; --brand-bg:#eaeeff;
    --green:#16a34a; --amber:#f59e0b; --red:#dc2626;
    --shadow:0 10px 30px rgba(15,20,36,.25);
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 10% -10%, #23305f 0%, transparent 60%),
      radial-gradient(1000px 500px at 110% 0%, #3a2a6e 0%, transparent 55%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    color:var(--text-inv);
    font-family:'Sarabun',sans-serif;
    display:flex;
    flex-direction:column;
  }
  .shell-header{
    padding:18px 24px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .logo{
    width:40px;height:40px;border-radius:12px;
    background:linear-gradient(135deg, var(--brand), var(--brand2));
    display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;font-weight:700;color:#fff;font-size:15px;
    box-shadow:0 6px 16px rgba(79,109,245,.35);
    flex-shrink:0;
  }
  .brand .titles h1{
    margin:0;font-size:17px;font-weight:700;letter-spacing:.2px;color:var(--text-inv);
  }
  .brand .titles p{
    margin:2px 0 0;font-size:12.5px;color:var(--sub-inv);
  }

  .tabbar{
    display:flex;gap:6px;background:rgba(255,255,255,.06);
    padding:5px;border-radius:999px;border:1px solid rgba(255,255,255,.08);
  }
  .tabbar button{
    appearance:none;border:0;background:transparent;color:var(--sub-inv);
    font-family:'Sarabun',sans-serif;font-size:14px;font-weight:600;
    padding:9px 18px;border-radius:999px;cursor:pointer;
    display:flex;align-items:center;gap:8px;
    transition:all .15s ease;
    white-space:nowrap;
  }
  .tabbar button svg{width:16px;height:16px;flex-shrink:0;}
  .tabbar button:hover{color:var(--text-inv);}
  .tabbar button.active{
    background:linear-gradient(135deg, var(--brand), var(--brand2));
    color:#fff;
    box-shadow:0 4px 14px rgba(79,109,245,.4);
  }

  .status-pill{
    font-size:11.5px; color:var(--sub-inv);
    font-family:'JetBrains Mono',monospace;
    display:flex; align-items:center; gap:6px;
    padding:6px 12px; border-radius:999px;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08);
  }
  .status-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--amber);}

  .stage{
    flex:1;
    margin:16px 20px 20px;
    background:var(--panel);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
    position:relative;
    min-height:0;
  }
  iframe{
    width:100%;height:100%;border:0;display:block;
    background:#eef1f8;
  }
  .frame{
    position:absolute; inset:0; display:none;
  }
  .frame.active{display:block;}

  .loading{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:#eef1f8; color:#6b7690; font-size:13px; gap:10px;
    flex-direction:column;
  }
  .loading .spin{
    width:26px;height:26px;border-radius:50%;
    border:3px solid #d6dcf5; border-top-color:var(--brand);
    animation:sp .8s linear infinite;
  }
  @keyframes sp{to{transform:rotate(360deg);}}

  @media (max-width:720px){
    .shell-header{padding:14px 14px 10px;}
    .brand .titles p{display:none;}
    .stage{margin:12px;}
    .tabbar button span.full{display:none;}
  }
</style>
</head>
<body>

<div class="shell-header">
  <div class="brand">
    <div class="logo">NX</div>
    <div class="titles">
      <h1>NIMEX Command Center</h1>
      <p>รวมระบบ Fleet Dashboard และ Cost Dashboard (AB/CC) ไว้ในที่เดียว</p>
    </div>
  </div>

  <div class="tabbar" role="tablist">
    <button class="tab-btn active" data-target="frame-fleet" id="btn-fleet">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h2l1-5h9l3 5h3v5h-2"/><circle cx="7.5" cy="18" r="1.8"/><circle cx="17.5" cy="18" r="1.8"/><path d="M9.3 18h6.4"/></svg>
      <span class="full">Fleet Dashboard</span>
    </button>
    <button class="tab-btn" data-target="frame-cost" id="btn-cost">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-6 3 3 5-8"/></svg>
      <span class="full">Cost Dashboard (AB/CC)</span>
    </button>
  </div>

  <div class="status-pill"><span class="dot" id="statusDot"></span><span id="statusText">กำลังโหลด...</span></div>
</div>

<div class="stage">
  <div class="frame active" id="frame-fleet">
    <div class="loading" id="load-fleet"><div class="spin"></div>กำลังโหลด Fleet Dashboard...</div>
    <iframe src="fleet.html" title="Fleet Dashboard" onload="frameLoaded('fleet')"></iframe>
  </div>
  <div class="frame" id="frame-cost">
    <div class="loading" id="load-cost"><div class="spin"></div>กำลังโหลด Cost Dashboard...</div>
    <iframe src="cost.html" title="Cost Dashboard AB/CC" onload="frameLoaded('cost')"></iframe>
  </div>
</div>

<script>
  const buttons = document.querySelectorAll('.tab-btn');
  const frames = document.querySelectorAll('.frame');
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      buttons.forEach(b => b.classList.remove('active'));
      frames.forEach(f => f.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.target).classList.add('active');
    });
  });

  const loaded = {fleet:false, cost:false};
  function frameLoaded(name){
    loaded[name] = true;
    const el = document.getElementById('load-'+name);
    if(el) el.style.display = 'none';
    updateStatus();
  }
  function updateStatus(){
    const dot = document.getElementById('statusDot');
    const txt = document.getElementById('statusText');
    if(loaded.fleet && loaded.cost){
      dot.style.background = 'var(--green)';
      txt.textContent = 'ระบบพร้อมใช้งาน';
    } else {
      dot.style.background = 'var(--amber)';
      txt.textContent = 'กำลังโหลด...';
    }
  }
</script>

</body>
</html>
